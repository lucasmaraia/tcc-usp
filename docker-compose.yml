services:
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: email-service-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - email-service-network

  email-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: email-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-guest}
      - RABBITMQ_ENABLED=true
      # Required: define these in a .env file (never commit real values).
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your .env file}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:?Set MAIL_USERNAME in your .env file}
      - MAIL_PASSWORD=${MAIL_PASSWORD:?Set MAIL_PASSWORD in your .env file}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - email-service-network

volumes:
  rabbitmq_data:
    driver: local

networks:
  email-service-network:
    driver: bridge
