# Stack local completa: MySQL + RabbitMQ + 3 instâncias da aplicação + Nginx (load balancer)
#
#   docker compose up --build -d
#
# Acesso: http://localhost:8080 (Nginx distribui entre as 3 instâncias)
# O header "X-Served-By" na resposta mostra qual instância atendeu a requisição.

x-app-environment: &app-environment
  DB_URL: jdbc:mysql://mysql:3306/emaildb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  DB_USERNAME: ${MYSQL_USER:-emailservice}
  DB_PASSWORD: ${MYSQL_PASSWORD:-emailservice}
  JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:-guest}
  RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
  RABBITMQ_ENABLED: "true"
  # O mesmo segredo em todas as instâncias: um token gerado por uma instância
  # precisa ser validado por qualquer outra atrás do balanceador.
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
  JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
  MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME in your .env file}
  MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in your .env file}

# Apenas a instância 1 tem a seção "build" — as três compartilham a mesma
# imagem, e builds concorrentes da mesma tag fazem o compose falhar.
x-app-service: &app-service
  image: email-service:latest
  pull_policy: never
  environment: *app-environment
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/login.html || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 40s
  networks:
    - email-service-network

services:
  mysql:
    image: mysql:8.4
    container_name: email-service-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: emaildb
      MYSQL_USER: ${MYSQL_USER:-emailservice}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-emailservice}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - email-service-network

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: email-service-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - email-service-network

  # A primeira instância sobe sozinha para criar/atualizar o schema (ddl-auto)
  # sem concorrência; as outras duas só sobem depois que ela está saudável.
  email-service-1:
    <<: *app-service
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: email-service-1
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  email-service-2:
    <<: *app-service
    container_name: email-service-2
    depends_on:
      email-service-1:
        condition: service_healthy

  email-service-3:
    <<: *app-service
    container_name: email-service-3
    depends_on:
      email-service-1:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: email-service-lb
    ports:
      # Use LB_PORT para trocar a porta se a 8080 estiver ocupada (ex.: app rodando na IDE)
      - "${LB_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      email-service-1:
        condition: service_healthy
      email-service-2:
        condition: service_healthy
      email-service-3:
        condition: service_healthy
    networks:
      - email-service-network

volumes:
  mysql_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  email-service-network:
    driver: bridge
