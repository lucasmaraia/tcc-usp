upstream email_service {
    # Round-robin entre as 3 instâncias; uma instância fora do ar é
    # removida da rotação após 3 falhas, por 10 segundos.
    server email-service-1:8080 max_fails=3 fail_timeout=10s;
    server email-service-2:8080 max_fails=3 fail_timeout=10s;
    server email-service-3:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;

    # Anexos de email podem ter até 10 MB (limite da aplicação) + overhead de Base64/JSON
    client_max_body_size 20m;

    location / {
        proxy_pass http://email_service;
        # $http_host preserva a porta (localhost:8080); $host a descartaria e
        # os redirects da aplicação apontariam para a porta 80
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Mostra qual instância atendeu — útil para demonstrar o balanceamento
        add_header X-Served-By $upstream_addr always;
    }
}
