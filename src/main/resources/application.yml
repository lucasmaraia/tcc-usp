server:
  port: 8080

spring:
  application:
    name: email-service

  datasource:
    url: jdbc:h2:file:./data/emaildb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        retry:
          enabled: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    # Never commit real credentials: configure via environment variables.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

rabbitmq:
  enabled: ${RABBITMQ_ENABLED:true}

jwt:
  # The default below is for local development only; always set JWT_SECRET in real deployments.
  secret: ${JWT_SECRET:ieJKjv3c0Tef7GfReUWw2fJIOHhLX5ZjgAiZpZZ2jTNsPrQsYki49vAeNCcJv0Go}
  expiration: ${JWT_EXPIRATION:3600000}

logging:
  level:
    root: INFO
    com.emailservice: DEBUG
    org.springframework.amqp: INFO
    org.springframework.security: INFO
