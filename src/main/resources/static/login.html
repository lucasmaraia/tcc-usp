<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Email Service</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="brand">
            <span class="brand-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
            </span>
            <h1>Email Service</h1>
        </div>
        <p class="auth-subtitle">Entre na sua conta para gerenciar templates</p>

        <div id="error" class="alert alert-error" role="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" class="form-control" required
                       autocomplete="username" placeholder="seu usuário">
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" class="form-control" required
                       autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Entrar</button>
        </form>

        <p class="auth-footer">Não tem uma conta? <a href="/register.html">Cadastre-se</a></p>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
